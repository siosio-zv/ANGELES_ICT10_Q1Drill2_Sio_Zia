<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with numbers and forms</title>

     <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2025.2.4/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2025.2.4/core.js">
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="styles.css" rel="stylesheet">

    <style>
        body{
            background-color: lightblue ; font-family: 'Times New Roman', Times, serif;
        }
    </style>

</head>
<body>
    <!-- Title -->
    <div class="col-auto text-center">
    <h1>Simple Calculator using forms and numbers</h1>
    <p>Enter two numbers and select an operation</p>

    <!-- First Number -->
    <div class="col-auto text-center">
    <label for="num1">First Number:</label>
    <input type="number" id="num1">

    <br><br>

    <!-- Operations -->
    <div class="col-auto text-center">
    <label>Select Operation: </label>
    <select id="operation">
        <option value="+">Addition (+)</option> <!-- Addition -->
        <option value="-">Subtraction (-)</option> <!-- Subtraction -->
        <option value="x">Multiplication (x)</option> <!-- Multiplication -->
        <option value="/">Division (/)</option> <!-- Division -->

    </select>

    <br><br>

    <!-- Second Number -->
    <div class="col-auto text-center">
    <label for="num2">Second Number:</label>
    <input type="number" id="num2">

    <br><br>

    <!-- Compute Button --> 
    <div class="col-auto text-center">
    <button py-click="compute">COMPUTE</button>
    <br><br>

    <!-- Results -->
    <div class="col-auto text-center"> 
    <div id="result">
        Result will appear here.
    </div>

    <script type="py" src="./main.py"></script>
    
</body>
</html>
